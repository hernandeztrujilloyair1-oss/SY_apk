<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Enfoque Seguro | Portal Operativo y Cobranza">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Enfoque Seguro">
  <title>Enfoque Seguro | Portal Operativo</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #091428;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      color: #D4AF37;
      font-family: Arial, sans-serif;
    }
    .loading-container {
      text-align: center;
    }
    .spinner {
      border: 4px solid rgba(212, 175, 55, 0.2);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border-left-color: #D4AF37;
      animation: spin 1s linear infinite;
      margin: 0 auto 16px auto;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading-container" id="app-loading">
    <div class="spinner"></div>
    <div style="font-size: 14px; font-weight: bold; letter-spacing: 1px;">ENFOQUE SEGURO</div>
    <div style="font-size: 11px; color: #94A3B8; margin-top: 6px;">Cargando sistema...</div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.unregister();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
