name: Compilar APK y Web Navegador

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Regenerar estructura nativa Android y Web
        run: |
          # 1. Respaldar lib si existe para evitar que flutter create la sobreescriba
          if [ -d "lib" ]; then
            cp -r lib lib_backup
          fi

          # 2. Generar carpetas nativas
          flutter create . --project-name sy_soluciones --platforms=android,web --org com.seguros.app

          # 3. Restaurar tu codigo original intacto
          if [ -d "lib_backup" ]; then
            cp -r lib_backup/* lib/
            rm -rf lib_backup
          fi

      - name: Desactivar verificacion estricta AAR y fijar SDK 36
        run: |
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdk = .*/compileSdk = 36/' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/compileSdkVersion .*/compileSdkVersion 36/' {} +
          find android/app -name "build.gradle*" -exec sed -i 's/targetSdk = .*/targetSdk = 36/' {} +

          mkdir -p ~/.gradle/init.d
          cat << 'EOF' > ~/.gradle/init.d/fix_aar.gradle
          allprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          compileSdkVersion 36
                      }
                  }
                  tasks.matching { it.name.contains("CheckAarMetadata") }.configureEach {
                      enabled = false
                  }
              }
          }
          EOF

      - name: Inyectar icono personalizado Android
        run: |
          if [ -f "assets/images/app_icon.png" ]; then
            echo "Icono encontrado en assets/images/app_icon.png. Aplicando reemplazo..."
            rm -rf android/app/src/main/res/mipmap-anydpi-v26
            for dir in android/app/src/main/res/mipmap-*; do
              if [ -d "$dir" ]; then
                cp -f assets/images/app_icon.png "$dir/ic_launcher.png"
                cp -f assets/images/app_icon.png "$dir/ic_launcher_round.png" 2>/dev/null || true
              fi
            done
            echo "Icono inyectado en todas las resoluciones."
          else
            echo "AVISO: No se encontro assets/images/app_icon.png"
          fi

      - name: Descargar dependencias
        run: flutter pub get

      - name: Compilar APK Android Release
        run: flutter build apk --release

      - name: Compilar Version Web para Navegador
        run: flutter build web --release --base-href /${{ github.event.repository.name }}/

      - name: Guardar APK como descargable
        uses: actions/upload-artifact@v4
        with:
          name: SistemaSeguros-Instalador-APK
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Desplegar automaticamente en GitHub Pages
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: build/web
          branch: gh-pages